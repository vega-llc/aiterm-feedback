name: 💡 Feature request / idea
description: Suggest something AITerm should do
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you like AITerm to do, and what problem does it solve for you?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: How would you use it?
      description: Walk me through the workflow where this would help.
    validations:
      required: false
